<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#313338">
<title>Discord</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #313338;
    color: #fff;
    font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #update {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 48px 28px 36px;
    text-align: center;
  }
  .logo {
    width: 96px;
    height: 96px;
    background: #5865F2;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 40px;
  }
  .logo svg { width: 56px; height: 56px; fill: #fff; }
  .content { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 340px; }
  h1 { font-size: 26px; font-weight: 700; margin: 24px 0 0; }
  p { font-size: 15px; line-height: 1.5; color: #b5bac1; margin: 0; }
  .version { font-size: 13px; color: #80848e; margin-top: 6px; }
  .progress {
    width: 100%;
    max-width: 320px;
    height: 6px;
    background: #1e1f22;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 6px;
  }
  .bar {
    height: 100%;
    width: 100%;
    background: #5865F2;
    border-radius: 3px;
    transform-origin: left;
    animation: fill 2.2s ease-out forwards;
  }
  @keyframes fill {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  .status { font-size: 13px; color: #b5bac1; min-height: 18px; }
  button {
    width: 100%;
    max-width: 360px;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #5865F2;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    opacity: 0.5;
    pointer-events: none;
    transition: opacity 0.2s, background 0.15s;
  }
  button.ready { opacity: 1; pointer-events: auto; }
  button.ready:active { background: #4752c4; }
  #player { display: none; position: fixed; inset: 0; background: #000; }
  #player iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <div id="update">
    <div class="logo">
      <svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
    </div>
    <div class="content">
      <h1>Discord has been updated</h1>
      <p>We've made some improvements to keep your chats fast and reliable.</p>
      <div class="version">Version 264.21 · Stable</div>
      <div class="progress"><div class="bar"></div></div>
      <div class="status" id="status">Applying update…</div>
    </div>
    <button id="continueBtn">Continue</button>
  </div>
  <div id="player">
    <iframe id="yt" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>
<script>
  const btn = document.getElementById('continueBtn');
  const status = document.getElementById('status');
  const update = document.getElementById('update');
  const player = document.getElementById('player');
  const yt = document.getElementById('yt');

  setTimeout(() => {
    status.textContent = 'Update complete. Tap Continue to launch Discord.';
    btn.classList.add('ready');
  }, 2300);

  btn.addEventListener('click', async () => {
    update.style.display = 'none';
    player.style.display = 'block';
    yt.src = 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&playsinline=1&rel=0&modestbranding=1';
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(() => {});
      }
    } catch (e) {}
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
